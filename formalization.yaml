    type: "article"
    location: "https://doi.org/10.7146/math.scand.a-10478"
    relationship: "background"
    note: >-
      x^n - x - 1 is irreducible over the rationals for every n >= 2,
      so the quotient rings Q[x]/(x^3 - x - 1) and Q[x]/(x^4 - x - 1)
