fidelity:
  divergences: >-
    The compared statements are instances at two fields of a classical
    theorem, so fidelity is design honesty; the design choices are:
    (a) the fields enter as the quotient rings AdjoinRoot of the
    concrete polynomials X^3 - X - 1 and X^4 - X - 1 over Q, and the
    power bases enter as the families i -> root^i indexed by Fin 3 and
    Fin 4 — no custom definition appears in any compared statement;
    (b) Algebra.traceMatrix and Algebra.discr are applied to those
    families (Mathlib defines both for an arbitrary finite family,
    with discr_def : discr = det of the trace matrix), so (10)-(11) are
    the discriminants OF THE POWER BASES; that these equal the field
    discriminants is cited from the LMFDB records (index 1) and not
    formalized; (c) the signature is stated through Mathlib's
    basis-free sigPos and sigNeg, so (14)-(17) are invariants of the
    quadratic form (Algebra.traceForm).toQuadraticMap on the field,
    independent of any basis or diagonalisation; the explicit weights
    of (12)-(13) are ONE diagonalisation, exhibited for concreteness, and
    the entry's prose never treats the weights themselves as
    invariants; (d) the classical (r_1 + r_2, r_2) theorem is neither
    stated nor used: the signatures are proved directly, and the
    embedding counts appear nowhere in the compared surface — the
    description's "the classical theorem predicts" sentences are
    context comparing the proved values with the literature; (e) the
    Hermite reading (signature difference = number of distinct real
    roots) is likewise context: no real-root count is compared; (f)
    irreducibility of the trinomials (Selmer, Mathlib) is used only in
    the prose to call the quotient rings fields — every compared
    statement is meaningful, and proved, for the quotient algebra as
    such; (g) the proof modules keep the parent development's file
    names (Pdt-prefixed) and namespace PDT; the compared surface lives
    in the namespace TraceForms and mentions neither; (h) the
    compositum statements (18)-(23) are about the tensor product
    K_3 ⊗_Q K_4 as a Q-algebra, with the tensor power family
    (i, j) -> x^i ⊗ y^j entering as a family indexed by Fin 3 × Fin 4;
    (23) proves that algebra is a field, so "the compositum" in the
    prose is the tensor product itself, and its identification with
    the registered entry's Q(rho·Q) is context; (i) the compositum
    signature is again stated through sigPos and sigNeg, and the
    prose's "tensor rule (2·3 + 1·1, 2·1 + 1·3)" describes the proof's
    weight count, not a compared statement; (j) (20) is the
    discriminant of the tensor power family; its equality with the
    field discriminant of the compositum is context, not formalized;
    (k) the general statements (1)-(7) carry exactly the hypotheses
    written in the Lean — free and finite modules for the algebras,
    finite index types with decidable equality for the discriminant,
    2 invertible for the quadratic-form statements, a linearly ordered
    field that is a strictly ordered ring and finite-dimensional spaces
    for the signature rule — and the prose never drops one; (l) the
    sign counts in (6)-(7) are Mathlib's sigPos/sigNeg, so the product
    rule is stated for possibly degenerate forms and does not assume
    nondegeneracy; (m) 'compositum' in the prose means the tensor
    product K_3 ⊗_Q K_4, proved a field in (23); (n) the numbering of
    the compared statements in every surface is (1)-(7) general,
    (8)-(17) the two fields, (18)-(23) the compositum.

