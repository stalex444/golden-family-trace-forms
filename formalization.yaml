project:
  name: "The trace form of a tensor product of algebras and the signature product rule, with the trace forms of Q[x]/(x^3 - x - 1), Q[x]/(x^4 - x - 1) and their compositum as instances"
  description: >-
    GENERAL THEOREMS FIRST. For finite free algebras A, B over a
    commutative ring R, the trace form of the tensor product A ⊗_R B is
    the tensor product of the trace forms, and over a linearly ordered
    field the Sylvester signature of a tensor product of quadratic forms
    obeys a product rule. Seven compared general statements: (1) the
    trace of a pure tensor is the product of the traces,
    Tr_{A⊗B}(a ⊗ b) = Tr_A(a)·Tr_B(b); (2) the trace form on pure
    tensors is the product of the trace forms; (3) the Gram matrix of a
    tensor basis bA ⊗ bB (Mathlib's Basis.tensorProduct) is the
    Kronecker product of the two Gram matrices; (4) the discriminant
    product formula WITH SIGN, disc(bA ⊗ bB) = disc(bA)^|kappa| ·
    disc(bB)^|iota| for bases indexed by finite types iota, kappa; (5)
    when 2 is invertible in R, the trace quadratic form of A ⊗ B is the
    tensor product (Mathlib's QuadraticForm.tmul) of the trace quadratic
    forms; (6)-(7) THE SIGNATURE PRODUCT RULE: over a linearly ordered
    field with 2 invertible, for quadratic forms Q1, Q2 on
    finite-dimensional spaces, sigPos(Q1 ⊗ Q2) = p1 p2 + n1 n2 and
    sigNeg(Q1 ⊗ Q2) = p1 n2 + n1 p2, with sigPos/sigNeg Mathlib's
    basis-free invariants (maximal dimension of a positive- resp.
    negative-definite subspace). (6)-(7) are the (p, n)-refinement of
    the multiplicativity of the signature homomorphism on the Witt ring
    of an ordered field (Lam 2005, Chapter VIII), stated for arbitrary
    (possibly degenerate) forms and proved by orthogonal bases and the
    uniqueness half of Sylvester's law. The Witt-ring statement gives
    only the difference p - n; recovering p and n separately for a
    possibly degenerate tensor product would in addition need the
    dimension of the radical of a tensor product, which Mathlib does
    not have either; the entry proves the two counts directly, without
    the Witt ring, which is not formalized. None of (1)-(7) was in Mathlib
    at the pin; Mathlib's nearest results are the trace of a tensor
    product of endomorphisms (LinearMap.trace_tensorProduct'), the
    determinant of a Kronecker product, the tensor product of quadratic
    forms and its polar form, orthogonal bases, and sigPos/sigNeg with
    Sylvester uniqueness — the infrastructure from which (1)-(7) are
    built. PRIOR ART on (4): Mathlib at the pin has
    NumberField.natAbs_discr_eq_natAbs_discr_pow_mul_natAbs_discr_pow —
    for two linearly disjoint number fields with coprime different
    ideals the ABSOLUTE VALUE of the discriminant of their compositum is
    |d1|^[K2:Q]·|d2|^[K1:Q] (via the different; the classical statement
    is in Khanduja 2019). Statement (4) is the elementary basis-level
    version: any finite free algebras over any commutative ring, the
    exact signed discriminant of the tensor basis, with no number-field,
    integrality or coprimality hypothesis; it neither implies nor is
    implied by the Mathlib theorem, and is cited beside it. THE
    INSTANCES (8)-(23), at the two fields cut out by the trinomials
    x^3 - x - 1 and x^4 - x - 1 — the cubic and quartic members of the
    family x^n - x - 1, irreducible over the rationals for every n >= 2
    by Selmer's theorem (Mathlib), whose real roots above 1 are the
    plastic number and the quartic root of x^4 = x + 1 — and their
    compositum. The trace form of a number field K of degree n is
    (x, y) -> Tr(xy); in the power basis 1, x, ..., x^(n-1) its Gram
    matrix is the Hankel matrix (Tr x^(i+j)) of the power sums of the
    roots. (8)-(9) The Gram matrices, entrywise: Algebra.traceMatrix of
    the power family equals the explicit integer Hankel matrix — power
    sums 3, 0, 2, 3, 2 for the cubic and 4, 0, 0, 3, 4, 0, 3 for the
    quartic, from Newton's identities on the coefficients. (10)-(11)
    The discriminants of the power bases, Algebra.discr of the same
    families: -23 and -283, both prime. (12)-(13) Explicit
    diagonalisations: the trace form, as a quadratic form, is
    equivalent to the weighted sum of squares with weights 3, 2, -23/6
    resp. 4, 4, -9/4, 283/36 — one congruence among many, exhibited with
    its rational change of basis. (14)-(17) The Sylvester signatures as
    basis-free invariants: sigPos and sigNeg are 2 and 1 for the cubic
    trace form and 3 and 1 for the quartic, read off from (12)-(13)
    through Sylvester uniqueness. (18)-(23) THE COMPOSITUM: the tensor
    product L = K_3 ⊗_Q K_4 is their compositum Q(rho, Q) — the degrees
    3 and 4 are coprime, so the fields are linearly disjoint and L is a
    field, statement (23), from Mathlib's coprime-degree
    linear-disjointness criterion — and (18)-(22) are the general
    theorems at this pair: Tr(x ⊗ y) = Tr(x)·Tr(y); the Gram matrix of
    the tensor power family x^i ⊗ y^j (Fin 3 × Fin 4) is the Kronecker
    product of the two Gram matrices; the discriminant of that family
    is (-23)^4·(-283)^3 by (4); the Sylvester signature is (7, 5) by
    (6)-(7) applied to (2, 1) and (3, 1) — agreeing with the classical
    (r_1 + r_2, r_2) for the compositum's two real and five complex
    places (context, not compared). The registered compositum entry
    PALOMAR-2026-09-01-000005 treats the same field as Q(rho·Q), through
    the degree-12 minimal polynomial of the product; that
    Q(rho, Q) = Q(rho·Q) follows by degree count and is context here,
    never compared. THE CLASSICAL SETTING of the instances: the trace
    form of a number field with r_1 real and r_2 pairs of complex
    embeddings has signature (r_1 + r_2, r_2) — for the Hankel form of a
    polynomial this is Hermite's 1856 theorem (the signature difference
    counts the distinct real roots), and for the discriminant matrix of
    a number field it is Taussky's 1968 note; Conner and Perlis's 1984
    survey is the standard reference. Here (r_1, r_2) = (1, 1), (2, 1)
    and (2, 5), so the classical theorem predicts exactly (2, 1),
    (3, 1) and (7, 5), and the Hermite counts 2 - 1 = 1 and 3 - 1 = 2
    match the real-root counts of the two trinomials. That general
    theorem is NOT formalized: the two-field instances are proved
    directly by explicit congruence, the compositum instance by the
    general theorems (1)-(7); the embedding counts r_1, r_2 appear in no
    compared statement. WHY THESE FIELDS, for the instances: the cubic
    field is the signature-[1, 1] cubic field of smallest absolute
    discriminant (LMFDB, sorted by |disc|: 3.1.23.1 first, then
    3.1.31.1); its Galois closure is the Artin field of the weight-one
    newform 23.1.b.a = eta(z) eta(23z), the classical Hecke example with
    Artin image S_3, whose analytic conductor the LMFDB records as
    minimal among all classical newforms and whose Stark unit is the
    root of x^3 - x - 1 itself; its integral trace form — which the
    compared Gram matrix (8) is, the power basis being an integral
    basis — is the object of Mantilla-Soler's study of integral trace
    forms of cubic fields (Algebra & Number Theory 2010). The quartic
    field is the degree-4 member of the same trinomial family,
    registered as the degree-4 Mahler-measure minimizer
    (PALOMAR-2026-08-31-000004), with the same profile: prime
    discriminant, monogenic. The field discriminants: the LMFDB records
    4.2.283.1 (defining polynomial x^4 - x - 1, signature [2, 1],
    discriminant -283, monogenic, index 1) and 3.1.23.1 (reduced
    defining polynomial x^3 - x^2 + 1, the field generated by -1/rho,
    signature [1, 1], discriminant -23, monogenic, index 1) list -283
    and -23 as the field discriminants; that the power bases are
    integral bases, so that the compared power-basis discriminants ARE
    the field discriminants, is cited from those records and not
    formalized; likewise the tensor power family is an integral basis
    of the compositum because the two discriminants are coprime (the
    standard integral-basis theorem for linearly disjoint fields;
    context only). PRIOR ART on the instances, as of the 2026-09-02
    sweep: Mathlib contains no trace-form or discriminant computation
    for either field. The nearest prior work is the Lean 4 certification
    framework of Baanen, Chavarri Villarello and Dahmen (CPP 2025) and
    its 2026 sequel (Chavarri Villarello and Dahmen): they certify rings
    of integers, FIELD discriminants (as the determinant of the trace
    matrix of a certified integral basis) and, in the sequel, the
    signature (r_1, r_2) by real-root counting, for LMFDB entries at
    large; neither treats the trace form's Sylvester signature, and
    their published example sets (seven non-monogenic cubic fields
    unramified outside 2, 3, 5 in the first; the v1 example directory of
    the second) contain neither of the two fields here (checked
    2026-09-02). Relative to that work, the compared discriminants
    (10)-(11) are the power-basis discriminants derived from the
    explicit Gram matrices — a weaker notion than the certified field
    discriminant, which coincides with it here because both fields are
    monogenic (LMFDB, cited) — and the Sylvester signatures have no
    counterpart there. The entry is not aware of a formalization, in
    any surveyed prover ecosystem, of the trace form of a tensor
    product of algebras, of the signature product rule, or of a number
    field's trace-form Sylvester signature. The proof modules descend
    from the author's public pdt-lean development (pinned below), where
    none of these statements was ever a compared statement. Axioms on
    every compared theorem: propext, Classical.choice, Quot.sound,
    audited in-build.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

