    type: "other"
    location: "https://www.lmfdb.org/ModularForm/GL2/Q/holomorphic/23/1/b/a/"
    relationship: "background"
    note: >-
      Places the cubic field: the classical Hecke weight-one form
      eta(z) eta(23z) has Artin image S_3 and Artin field the Galois
      closure of 3.1.23.1, the field of x^3 - x - 1. Cited to show why
      this field is a natural object; nothing about modular forms is
      formalized or compared.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Introduction to Quadratic Forms over Fields"
    authors:
      - "T. Y. Lam"
    id: "Graduate Studies in Mathematics 67, American Mathematical Society, Providence, RI, 2005; ISBN 0-8218-1095-2"
    # Bibliographic data verified 2026-09-02 (this entry) against the
    # AMS listing and the Bull. LMS review record; Chapter VIII is
    # "Formally real fields, real-closed fields, and Pythagorean fields".
    type: "book"
    location: "https://bookstore.ams.org/gsm-67"
    relationship: "background"
    note: >-
      The classical setting of the signature product rule (6)-(7):
      over an ordered field the signature is a ring homomorphism from
      the Witt ring to the integers, so it is multiplicative on tensor
      products (Chapter VIII, formally real fields and signatures).
      Statements (6)-(7) are the (p, n)-refinement of that
      multiplicativity, sigPos and sigNeg separately, for arbitrary and
      possibly degenerate forms; proved here directly by orthogonal
      bases, not through the Witt ring, which is not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The discriminant of compositum of algebraic number fields"
    authors:
      - "Sudesh K. Khanduja"
    id: "International Journal of Number Theory 15 (2019), no. 2, 353-360"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.1142/S1793042119500167 — author Khanduja, Int. J. Number
    # Theory volume 15, issue 02, pages 353-360, 2019.
    type: "article"
    location: "https://doi.org/10.1142/S1793042119500167"
    relationship: "background"
    note: >-
      The classical field-level discriminant formula for a compositum
      of number fields with coprime discriminants,
      d(K1 K2) = d(K1)^[K2:Q] · d(K2)^[K1:Q], and its refinements. The
      compared statement (4) is the elementary basis-level product
      formula for a tensor basis of arbitrary finite free algebras,
      with sign; the field-level identification for the compositum of
      the two golden-family fields (that the tensor power family is an
      integral basis) is context, not formalized. Mathlib's absolute-
      value version for linearly disjoint number fields with coprime
      differents is disclosed under related formalizations.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Certifying Rings of Integers in Number Fields"
    authors:
      - "Anne Baanen"
      - "Alain Chavarri Villarello"
      - "Sander R. Dahmen"
    id: "Proceedings of the 14th ACM SIGPLAN International Conference on Certified Programs and Proofs (CPP 2025), ACM, 50-66"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.1145/3703595.3705874 — authors Baanen, Chavarri Villarello,
    # Dahmen; CPP 2025 proceedings, pages 50-66, ACM. Preprint arXiv
