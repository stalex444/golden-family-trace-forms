    license: "unknown"
    author_endorsement: "n/a"
  - title: "Number field 3.1.23.1"
    authors:
      - "The LMFDB Collaboration"
    id: "The L-functions and Modular Forms Database, number field 3.1.23.1 (reduced defining polynomial x^3 - x^2 + 1)"
    # Record read 2026-09-02 (this entry): reduced defining polynomial
    # x^3 - x^2 + 1, signature [1, 1], discriminant -23 (prime), class
    # number 1, monogenic, index 1. The field Q[x]/(x^3 - x - 1) of the
    # compared statements is this field: if rho^3 = rho + 1 then
    # -1/rho is a root of x^3 - x^2 + 1, and the discriminant -23 is
    # squarefree, so the power basis of x^3 - x - 1 is an integral
    # basis as well.
    type: "other"
    location: "https://www.lmfdb.org/NumberField/3.1.23.1"
    relationship: "background"
    note: >-
      The database record of the cubic field, under its reduced
      defining polynomial x^3 - x^2 + 1 (the substitution x -> -1/x
      carries x^3 - x - 1 to it). Cited for the facts NOT formalized
      here: the signature [1, 1] (so the classical theorem predicts
      (2, 1), confirmed directly by the compared statements) and the
      identification of the compared power-basis discriminant -23 with
      the field discriminant.
    license: "unknown"
    author_endorsement: "n/a"

