status:
  scope: >-
    Formalized, ten compared theorems, no hypotheses (every statement
    is closed). (1) traceMatrix_cubic and (2) traceMatrix_quartic —
    Algebra.traceMatrix of the power family 1, x, ..., x^(n-1) of
    Q[x]/(x^n - x - 1) equals the explicit integer Hankel matrix of the
    power sums, for n = 3 and n = 4. (3) discr_cubic and (4)
    discr_quartic — Algebra.discr of the same families is -23 and
    -283. (5) traceForm_cubic_equiv and (6) traceForm_quartic_equiv —
    the trace form as a quadratic form is equivalent to the weighted
    sum of squares with weights 3, 2, -23/6 resp. 4, 4, -9/4, 283/36.
    (7)-(8) sigPos_cubic = 2, sigNeg_cubic = 1; (9)-(10)
    sigPos_quartic = 3, sigNeg_quartic = 1. NOT formalized: the
    classical (r_1 + r_2, r_2) theorem (Hermite 1856, Taussky 1968) —
    the two instances are proved directly; the embedding counts r_1,
    r_2 and the real-root counts of the trinomials (context, from the
    registered family entry and the LMFDB records); the identification
    of the power-basis discriminants with the field discriminants
    (the power bases are integral bases — LMFDB, cited). Irreducibility
    of the two trinomials (Selmer, in Mathlib) is not invoked by any
    compared statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly [propext,
  # Classical.choice, Quot.sound]; the axiom audit was run over all 51
  # theorems of PdtTraceLink (57 declarations; the six others are
  # definitions) and all theorems of PdtTraceSignature as well. The
  # Challenge module carries the ten
  # statements sorry-proved as the comparison surface; Solution proves
  # all of them by transfer from the four proof modules. sorry_count is
  # over the proof development (the four modules and Solution); the ten
  # Challenge placeholders are the comparison surface by construction
  # and are the only `sorry` in the repository.

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Fable-class orchestration; Opus-class proof agents, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted proof drafting and error-loop iteration against
        lake build, under the author's direction; every compared
        declaration kernel-checked and axiom-audited (#print axioms:
        propext, Classical.choice, Quot.sound). The two matrix modules
        (PdtSignature, PdtSignatureRho: explicit congruences,
        determinants) predate this entry in the parent development. The
        two modules written for this entry, 2026-09-02, were each built
        under a declared build budget: PdtTraceLink (traces of the
        powers of the root through the left-multiplication matrices,
        the trace matrices, the discriminants) within a budget of
        fifteen builds, zero errors at completion, all 51 of its
        theorems axiom-audited (57 declarations, six of them
        definitions); PdtTraceSignature (the isometries and the
        sigPos/sigNeg invariants) in eleven of twelve budgeted builds,
        about thirty-five minutes. The comparison surface (Challenge,
        Solution) was then written and built green in this repository.
      cost:
        wall_time: "one session, 2026-09-02"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Statements fixed first (the ten compared forms, in Mathlib
        vocabulary only); proofs iterated against the compiler module
        by module. The signature module's route: the congruence matrix
        is pushed into a basis (the image of the power basis under the
        invertible rational matrix), so that the basis representation
        of the trace form is EQUAL, not merely isometric, to the
        weighted sum of squares, and Mathlib's Sylvester uniqueness
        then reads off sigPos and sigNeg; this avoided the
        associated-form and orthogonal-basis machinery entirely.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Author-directed target selection, statement design, and
        acceptance; statements audited by the author against the
        sources, the LMFDB records, and the sibling entries' registered
        surfaces.
      cost:
        wall_time: "included in the session above"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    Human-directed, machine-verified workflow: the author fixes
    targets and reviews statements; AI assistance drafts and repairs
    proofs; the Lean kernel is the acceptance criterion.

fidelity:
  divergences: >-
    The compared statements are instances at two fields of a classical
    theorem, so fidelity is design honesty; the design choices are:
    (a) the fields enter as the quotient rings AdjoinRoot of the
    concrete polynomials X^3 - X - 1 and X^4 - X - 1 over Q, and the
    power bases enter as the families i -> root^i indexed by Fin 3 and
    Fin 4 — no custom definition appears in any compared statement;
    (b) Algebra.traceMatrix and Algebra.discr are applied to those
    families (Mathlib defines both for an arbitrary finite family,
    with discr_def : discr = det of the trace matrix), so (3)-(4) are
    the discriminants OF THE POWER BASES; that these equal the field
    discriminants is cited from the LMFDB records (index 1) and not
    formalized; (c) the signature is stated through Mathlib's
    basis-free sigPos and sigNeg, so (7)-(10) are invariants of the
    quadratic form (Algebra.traceForm).toQuadraticMap on the field,
    independent of any basis or diagonalisation; the explicit weights
    of (5)-(6) are ONE diagonalisation, exhibited for concreteness, and
    the entry's prose never treats the weights themselves as
    invariants; (d) the classical (r_1 + r_2, r_2) theorem is neither
    stated nor used: the signatures are proved directly, and the
    embedding counts appear nowhere in the compared surface — the
    description's "the classical theorem predicts" sentences are
    context comparing the proved values with the literature; (e) the
    Hermite reading (signature difference = number of distinct real
    roots) is likewise context: no real-root count is compared; (f)
    irreducibility of the trinomials (Selmer, Mathlib) is used only in
    the prose to call the quotient rings fields — every compared
    statement is meaningful, and proved, for the quotient algebra as
    such; (g) the proof modules keep the parent development's file
    names (Pdt-prefixed) and namespace PDT; the compared surface lives
    in the namespace TraceForms and mentions neither.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    Statements audited by the author against the sources, the LMFDB
    records, and the sibling entries' registered surfaces; the kernel
    and the axiom audit are the acceptance criteria. In-house checks
    applied 2026-09-02 (AI-assisted: Anthropic Claude, in Claude Code,
    under the author's direction): the canon lookup that located the
    parent development's pre-existing trace-form and discriminant
    modules; verification of every bibliographic record against
    Crossref and of both LMFDB records directly; a Mathlib prior-art
    sweep at the pin for the signature theorem and for computations at
    these fields (none found) together with a literature sweep that
    located the Baanen-Chavarri Villarello-Dahmen certification
    framework and its 2026 sequel, both disclosed in the sources with
    their example sets checked; the mechanical surface gates (every
    compared name present in both Challenge and Solution and in the
    comparator; sorry count in Challenge equal to the compared count and
    zero elsewhere; axiom audit over every compared declaration;
    provenance pin present; the fidelity list checked against the
    statements); and an adversarial mock-referee audit of the
    comparison surface (mathematical fidelity, kernel integrity,
    metadata and citations, repository prose) before submission — its
    findings and their resolution are recorded in the repository
    README's review note.

alignment:
  namespace: "TraceForms"
  statements:
    - source: "Classical (the trace of x^k is the k-th power sum of the roots; Newton's identities on x^3 - x - 1 give 3, 0, 2, 3, 2 — textbook, and in Mathlib's NewtonIdentities file, though the proof computes the traces directly); Hermite 1856 for the Hankel form; Mantilla-Soler 2010 for the integral trace form of a cubic field as a research object"
      lean: "TraceForms.traceMatrix_cubic"
      module: "Solution"
      status: "proved"
      note: >-
        Entrywise identification of Algebra.traceMatrix of the family
        1, x, x^2 with !![3,0,2; 0,2,3; 2,3,2]. Proved through the
        left-multiplication matrices: r^3 = r + 1 rewrites every
        product r^i r^j into the power basis, and the trace of the
        left-multiplication matrix gives Tr(r^k) for k <= 4.
    - source: "Classical (the trace of x^k is the k-th power sum of the roots; Newton's identities on x^4 - x - 1 give 4, 0, 0, 3, 4, 0, 3 — textbook, and in Mathlib's NewtonIdentities file, though the proof computes the traces directly); Hermite 1856 for the Hankel form"
      lean: "TraceForms.traceMatrix_quartic"
      module: "Solution"
      status: "proved"
      note: >-
        Entrywise identification of Algebra.traceMatrix of the family
        1, x, x^2, x^3 with !![4,0,0,3; 0,0,3,4; 0,3,4,0; 3,4,0,3];
        same route, r^4 = r + 1, traces of r^k for k <= 6.
    - source: "Classical (disc(x^3 - x - 1) = -4(-1)^3 - 27(-1)^2 = -23); LMFDB 3.1.23.1 for the field discriminant (context)"
      lean: "TraceForms.discr_cubic"
      module: "Solution"
      status: "proved"
      note: >-
        Algebra.discr of the power family is the determinant of the
        trace matrix (discr_def), which is -23 by direct evaluation.
        The power-basis discriminant; its equality with the field
        discriminant is cited, not formalized.
    - source: "Classical (disc(x^4 - x - 1) = -283); LMFDB 4.2.283.1 for the field discriminant (context)"
      lean: "TraceForms.discr_quartic"
      module: "Solution"
      status: "proved"
      note: >-
        Same route; determinant -283. The power-basis discriminant;
        its equality with the field discriminant is cited, not
        formalized.
    - source: "Sylvester 1852 (the sign counts of any diagonalisation of a real quadratic form are invariants of the form); the specific diagonalisation with weights 3, 2, -23/6 is this entry's exhibited certificate, an explicit rational congruence"
      lean: "TraceForms.traceForm_cubic_equiv"
      module: "Solution"
      status: "proved"
      note: >-
        QuadraticMap.Equivalent between the trace form as a quadratic
        form and weightedSumSquares with the stated weights. The
        congruence matrix is pushed into a basis, whose basis
        representation of the trace form is equal to the weighted sum
        of squares; the isometry is Mathlib's basis-representation
        isometry.
    - source: "Sylvester 1852 (invariance of the sign counts); the specific diagonalisation with weights 4, 4, -9/4, 283/36 is this entry's exhibited certificate, an explicit rational congruence"
      lean: "TraceForms.traceForm_quartic_equiv"
      module: "Solution"
      status: "proved"
      note: >-
        Same route for the quartic.
    - source: "Taussky 1968 (r_1 + r_2 = 2 positive eigenvalues for a cubic field of signature [1, 1]); Hermite 1856 (signature difference 1 = one real root); proved here directly"
      lean: "TraceForms.sigPos_cubic"
      module: "Solution"
      status: "proved"
      note: >-
        sigPos of the cubic trace form is 2: from the equivalence and
        QuadraticForm.sigPos_of_equiv_weightedSumSquares, the number of
        positive weights among 3, 2, -23/6.
    - source: "Taussky 1968 (r_2 = 1 negative eigenvalue); proved here directly"
      lean: "TraceForms.sigNeg_cubic"
      module: "Solution"
      status: "proved"
      note: >-
        sigNeg of the cubic trace form is 1: the number of negative
        weights. With sigPos_cubic, signature (2, 1).
    - source: "Taussky 1968 (r_1 + r_2 = 3 positive eigenvalues for a quartic field of signature [2, 1]); Hermite 1856 (signature difference 2 = two real roots); proved here directly"
      lean: "TraceForms.sigPos_quartic"
      module: "Solution"
      status: "proved"
      note: >-
        sigPos of the quartic trace form is 3: the number of positive
        weights among 4, 4, -9/4, 283/36.
    - source: "Taussky 1968 (r_2 = 1 negative eigenvalue); proved here directly"
      lean: "TraceForms.sigNeg_quartic"
      module: "Solution"
      status: "proved"
      note: >-
        sigNeg of the quartic trace form is 1. With sigPos_quartic,
        signature (3, 1).

