    # 3.1.23.1 or 4.2.283.1 (checked 2026-09-02).
    type: "article"
    location: "https://arxiv.org/abs/2607.26230"
    relationship: "background"
    note: >-
      PRIOR ART, disclosed. The sequel: certifies further invariants —
      the signature (r_1, r_2), defined there as the numbers of real
      and complex places and certified there by real-root counting of
      the defining polynomial; the
      unit group modulo p-th powers; the class group — and improves
      discriminant certification to higher degrees. "Signature" there
      is the embedding count, not the Sylvester signature of the trace
      form; the paper mentions neither the trace form's inertia
      indices nor Sylvester's law. The compared statements (7)-(10)
      are the trace-form Sylvester signatures, whose relation to
      (r_1, r_2) is the classical (r_1 + r_2, r_2) theorem, cited and
      not formalized here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On the irreducibility of certain trinomials"
    authors:
      - "Ernst S. Selmer"
    id: "Mathematica Scandinavica 4 (1956), 287-302"
    # Crossref-verified 2026-09-01 (the author's sibling entries):
