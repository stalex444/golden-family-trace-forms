alignment:
  namespace: "TraceForms"
  statements:
    - source: "Classical (the trace of a tensor product of endomorphisms is the product of the traces — in Mathlib as LinearMap.trace_tensorProduct'; applied to left multiplication by a pure tensor); no source states it for the algebra trace"
      lean: "TraceForms.trace_tmul"
      module: "Solution"
      status: "proved"
      note: >-
        General: R a commutative ring, A and B finite free commutative
        R-algebras; Tr_{A⊗B}(a ⊗ b) = Tr_A(a)·Tr_B(b). Left multiplication
        by a ⊗ b is TensorProduct.map of the two left multiplications.
    - source: "Classical; corollary of (1) with Algebra.TensorProduct.tmul_mul_tmul"
      lean: "TraceForms.traceForm_tmul"
      module: "Solution"
      status: "proved"
      note: >-
        General: the trace form of A ⊗ B on pure tensors is the product of
        the trace forms.
    - source: "Classical (Gram matrix of a tensor product of bilinear forms in a tensor basis is the Kronecker product); no source states it for Algebra.traceMatrix"
      lean: "TraceForms.traceMatrix_tensorProduct"
      module: "Solution"
      status: "proved"
      note: >-
        General: for bases bA, bB indexed by arbitrary types, the trace
        matrix of Basis.tensorProduct bA bB is the Kronecker product of
        the trace matrices, entrywise from (2).
    - source: "Khanduja 2019 for the field-level compositum formula; Mathlib's NumberField.natAbs_discr_eq_natAbs_discr_pow_mul_natAbs_discr_pow for its absolute-value form (disclosed prior art); Matrix.det_kronecker for the determinant identity"
      lean: "TraceForms.discr_tensorProduct"
      module: "Solution"
      status: "proved"
      note: >-
        General, basis-level, with sign: for finite index types with
        decidable equality, Algebra.discr of the tensor basis is
        disc(bA)^|kappa| · disc(bB)^|iota|, from (3) and the determinant of
        a Kronecker product. Different statement from the Mathlib
        number-field theorem (arbitrary finite free algebras, exact
        sign, no integrality or coprimality); neither implies the other.
    - source: "Classical (tensor product of bilinear forms; Mathlib's QuadraticForm.tmul and associated_tmul supply the tensor product of quadratic forms and its polar form)"
      lean: "TraceForms.traceForm_toQuadraticMap_tensor"
      module: "Solution"
      status: "proved"
      note: >-
        General, with 2 invertible in R: the trace quadratic form of A ⊗ B
        equals QuadraticForm.tmul of the trace quadratic forms of A and B,
        by comparing polar forms on pure tensors via (2).
    - source: "Lam 2005, Chapter VIII (the signature is multiplicative on the Witt ring of an ordered field); Sylvester 1852 for the invariance of the sign counts; the (p, n)-refinement stated here for arbitrary forms is proved directly"
      lean: "TraceForms.sigPos_tmul"
      module: "Solution"
      status: "proved"
      note: >-
        General: over a linearly ordered field with 2 invertible and
        finite-dimensional V, W, sigPos(Q1 ⊗ Q2) = p1 p2 + n1 n2. Proof:
        orthogonal bases of both forms, the tensor family is orthogonal
        for the tensor form with product weights, Sylvester uniqueness
        reads sigPos off the weights, and a counting lemma gives the
        number of positive products.
    - source: "Lam 2005, Chapter VIII; Sylvester 1852; proved directly"
      lean: "TraceForms.sigNeg_tmul"
      module: "Solution"
      status: "proved"
      note: >-
        General: sigNeg(Q1 ⊗ Q2) = p1 n2 + n1 p2, the same route with the
        count of negative products.
    - source: "Classical (the trace of x^k is the k-th power sum of the roots; Newton's identities on x^3 - x - 1 give 3, 0, 2, 3, 2 — textbook, and in Mathlib's NewtonIdentities file, though the proof computes the traces directly); Hermite 1856 for the Hankel form; Mantilla-Soler 2010 for the integral trace form of a cubic field as a research object"
