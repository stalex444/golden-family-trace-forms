    author_endorsement: "n/a"
  - title: "Formally certifying number field invariants"
    authors:
      - "Alain Chavarri Villarello"
      - "Sander R. Dahmen"
    id: "arXiv:2607.26230 (submitted 2026-07-28)"
    # Read 2026-09-02 (this entry): abstract and text at
    # arxiv.org/abs/2607.26230; code at
    # github.com/alainchmt/CertifyingInvariantsNF (tag v1), examples
