      Browning) in the description only: no compared statement
      invokes irreducibility — the trace matrix, the discriminant, and
      the quadratic form are defined for the quotient algebra as it
      stands, and the statements are about that algebra, which is the
      field.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Number field 4.2.283.1"
    authors:
