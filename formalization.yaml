    - source: "Classical (a tensor product of two finite field extensions of coprime degrees is a field: they are linearly disjoint; in Mathlib as IntermediateField.LinearDisjoint.of_finrank_coprime with LinearDisjoint.isField_of_forall); Selmer 1956 for the degrees 3 and 4 (irreducibility, re-proved modulo 2 in PdtIrreducible)"
