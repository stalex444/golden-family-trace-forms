sources:
  - title: "Extrait d'une lettre de Mr. Ch. Hermite de Paris à Mr. Borchardt de Berlin sur le nombre des racines d'une équation algébrique comprises entre des limites données"
    authors:
      - "Charles Hermite"
    id: "Journal für die reine und angewandte Mathematik 52 (1856), 39-51"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.1515/crll.1856.52.39 — author Ch. Hermite, Crelle's Journal,
    # volume 1856 issue 52, pages 39-51.
    type: "article"
    location: "https://doi.org/10.1515/crll.1856.52.39"
    relationship: "background"
    note: >-
      The classical origin of the signature statement for the Hankel
      form of a polynomial: the quadratic form with matrix (p_(i+j)),
      p_k the power sums of the roots, has rank equal to the number of
      distinct roots and signature (positive minus negative index)
      equal to the number of distinct real roots. The compared Gram
      matrices (1)-(2) are exactly these Hankel forms for x^3 - x - 1
      and x^4 - x - 1, and the compared signatures (7)-(10) give the
      Hermite counts 1 and 2 — the real-root counts of the two
      trinomials. Cited as the classical setting; Hermite's general
      theorem is not formalized here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The Discriminant Matrices of an Algebraic Number Field"
    authors:
      - "Olga Taussky"
    id: "Journal of the London Mathematical Society s1-43 (1968), no. 1, 152-154"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.1112/jlms/s1-43.1.152 — author Olga Taussky, J. London Math.
    # Soc. volume s1-43, issue 1, pages 152-154.
    type: "article"
    location: "https://doi.org/10.1112/jlms/s1-43.1.152"
    relationship: "background"
    note: >-
      The number-field form of the same statement: the discriminant
      matrix (the trace-form Gram matrix) of a number field with r_1
      real and r_2 pairs of complex embeddings has r_1 + r_2 positive
      and r_2 negative eigenvalues. The compared signatures (2, 1) and
      (3, 1) are the instances (r_1, r_2) = (1, 1) and (2, 1). Cited as
      the classical setting; the general theorem is not formalized and
      the embedding counts appear in no compared statement.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "A Survey of Trace Forms of Algebraic Number Fields"
    authors:
      - "Pierre E. Conner"
      - "Robert Perlis"
    id: "Series in Pure Mathematics 2, World Scientific, Singapore, 1984"
    # Crossref-verified 2026-09-02 (this entry): DOI 10.1142/0066 —
    # authors P. E. Conner and R. Perlis, World Scientific, 1984.
    type: "book"
    location: "https://doi.org/10.1142/0066"
    relationship: "background"
    note: >-
      The standard reference on trace forms of number fields (Chapter
      I for the signature and the discriminant as invariants of the
      trace form). Cited to place the entry: the two compared trace
      forms are the smallest members of the family whose survey this
      is.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "A demonstration of the theorem that every homogeneous quadratic polynomial is reducible by real orthogonal substitutions to the form of a sum of positive and negative squares"
    authors:
      - "James Joseph Sylvester"
    id: "The London, Edinburgh, and Dublin Philosophical Magazine and Journal of Science 4 (1852), 138-142"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.1080/14786445208647087 — author J. J. Sylvester, Philosophical
    # Magazine volume 4, pages 138-142, 1852.
    type: "article"
    location: "https://doi.org/10.1080/14786445208647087"
    relationship: "background"
    note: >-
      Sylvester's law of inertia: the numbers of positive and negative
      squares in any diagonalisation of a real quadratic form are
      invariants of the form. Consumed here in Mathlib's form — sigPos
      and sigNeg with QuadraticForm.sigPos_of_equiv_weightedSumSquares
      and sigNeg_of_equiv_weightedSumSquares (the uniqueness half) —
      to read the compared signatures (7)-(10) off the exhibited
      diagonalisations (5)-(6). Not re-proved here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Integral trace forms associated to cubic extensions"
    authors:
      - "Guillermo Mantilla-Soler"
    id: "Algebra & Number Theory 4 (2010), no. 6, 681-699"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.2140/ant.2010.4.681 — author Mantilla-Soler, Algebra & Number
    # Theory volume 4, issue 6, pages 681-699, 2010.
    type: "article"
    location: "https://doi.org/10.2140/ant.2010.4.681"
    relationship: "background"
    note: >-
      The research setting of the cubic Gram matrix: the integral trace
      form of a cubic field as an invariant, and how much of the field
      it determines. The compared matrix (1) is the integral trace form
      of the field 3.1.23.1 in the power basis (an integral basis,
