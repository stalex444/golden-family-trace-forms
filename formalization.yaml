status:
  scope: >-
    Formalized, twenty-three compared theorems, seven general and sixteen
    instances. GENERAL, with hypotheses exactly as stated in the Lean:
    (1) trace_tmul and (2) traceForm_tmul — R a commutative ring, A and B
    commutative R-algebras that are free and finite as R-modules; the
    trace of a ⊗ b is Tr(a)·Tr(b) and the trace form on pure tensors is
    the product of the trace forms. (3) traceMatrix_tensorProduct — same
    hypotheses, bases indexed by arbitrary types: the trace matrix of
    bA.tensorProduct bB is the Kronecker product. (4)
    discr_tensorProduct — index types finite with decidable equality:
    Algebra.discr of the tensor basis is disc(bA)^|kappa|·disc(bB)^|iota|,
    with sign. (5) traceForm_toQuadraticMap_tensor — additionally 2
    invertible in R: the trace quadratic form of A ⊗ B is
    QuadraticForm.tmul of the two trace quadratic forms. (6)-(7)
    sigPos_tmul, sigNeg_tmul — K a field with a linear order making it a
    strictly ordered ring (the class under which Mathlib's sigPos is
    defined), 2 invertible in K, V and W finite-dimensional: the
    signature product rule, both parts. Hypotheses honesty: (6)-(7) need
    finite-dimensionality only for the diagonalisation; no
    nondegeneracy is assumed (zero weights contribute to neither
    count). INSTANCES: (8) traceMatrix_cubic and (9) traceMatrix_quartic
    — the trace matrix of the power family i ↦ x^i is the explicit
    Hankel matrix; (10) discr_cubic = -23, (11) discr_quartic = -283
    (Algebra.discr of the same families); (12)-(13) explicit
    diagonalisations, QuadraticMap.Equivalent to the weighted sums of
    squares with weights 3, 2, -23/6 and 4, 4, -9/4, 283/36; (14)-(17)
    sigPos/sigNeg of the two trace forms: 2, 1, 3, 1; (18)
    trace_tmul_compositum — in K_3 ⊗_Q K_4, Tr(x ⊗ y) = Tr x·Tr y; (19)
    traceMatrix_compositum — the trace matrix of the tensor power family
    (i, j) ↦ x^i ⊗ y^j is the Kronecker product of the two Gram
    matrices; (20) discr_compositum = (-23)^4·(-283)^3; (21)-(22)
    sigPos_compositum = 7, sigNeg_compositum = 5; (23) isField_compositum
    — K_3 ⊗_Q K_4 is a field. In the Solution, (20)-(22) are derived from
    the general theorems (4), (6)-(7) and the factor data. NOT
    formalized: the classical (r_1 + r_2, r_2) theorem (Hermite 1856,
    Taussky 1968); the embedding counts and real-root counts (context);
    the identification of power-basis discriminants with field
    discriminants (LMFDB, cited) and of the tensor power family with an
    integral basis of the compositum (standard, context); the
    identification Q(rho, Q) = Q(rho·Q) with the registered compositum
    entry's field (degree count, context); Mathlib's field-level
    absolute-value compositum discriminant theorem is disclosed as prior
    art and not used. Irreducibility of the two trinomials (Selmer, in
    Mathlib; re-proved modulo 2 in PdtIrreducible) is consumed only by
    (23), through the finrank computations 3 and 4.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly [propext,
  # Classical.choice, Quot.sound]; the axiom audit was run over all 51
  # theorems of PdtTraceLink (57 declarations; the six others are
  # definitions), all theorems of PdtTraceSignature, and all 29
  # theorems and lemmas of PdtTraceCompositum as well. The
  # Challenge module carries the sixteen
  # statements sorry-proved as the comparison surface; Solution proves
  # all of them by transfer from the seven proof modules. sorry_count is
  # over the proof development (the seven modules and Solution); the
  # twenty-three Challenge placeholders are the comparison surface by
  # construction and are the only `sorry` in the repository.

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Fable-class orchestration; Opus-class proof agents, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted proof drafting and error-loop iteration against
        lake build, under the author's direction; every compared
        declaration kernel-checked and axiom-audited (#print axioms:
        propext, Classical.choice, Quot.sound). The two matrix modules
        (PdtSignature, PdtSignatureRho: explicit congruences,
        determinants) predate this entry in the parent development. The four modules written for this entry, 2026-09-02, were each built
        under a declared build budget: PdtTraceLink (traces of the
        powers of the root through the left-multiplication matrices,
        the trace matrices, the discriminants) within a budget of
        fifteen builds, zero errors at completion, all 51 of its
        theorems axiom-audited (57 declarations, six of them
        definitions); PdtTraceSignature (the isometries and the
        sigPos/sigNeg invariants) in eleven of twelve budgeted builds,
        about thirty-five minutes; PdtTraceCompositum (the
        tensor-product trace form, Kronecker Gram matrix, discriminant,
        signature (7, 5), and the field property of the compositum) in
        five of twelve budgeted builds, about thirty-five minutes, all
        29 of its theorems and lemmas axiom-audited. The comparison
        surface (Challenge, Solution) was then written and built green
        in this repository, first with ten statements and then extended
        to sixteen.
      cost:
        wall_time: "one session, 2026-09-02"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        Statements fixed first (the twenty-three compared forms — ten, then six
        for the compositum — in Mathlib
        vocabulary only); proofs iterated against the compiler module
        by module. The signature module's route: the congruence matrix
        is pushed into a basis (the image of the power basis under the
        invertible rational matrix), so that the basis representation
        of the trace form is EQUAL, not merely isometric, to the
        weighted sum of squares, and Mathlib's Sylvester uniqueness
        then reads off sigPos and sigNeg; this avoided the
        associated-form and orthogonal-basis machinery entirely. The
        compositum module's route: left multiplication by a pure tensor
        is the tensor product of the two left multiplications, so
        Mathlib's trace_tensorProduct' gives the trace of a pure tensor
        as the product of traces; the tensor of the two diagonalising
        bases is then orthogonal with the twelve product weights, and
        Sylvester uniqueness gives (7, 5); the field property is
        Mathlib's coprime-degree linear-disjointness criterion, proved
        over a generic base field and specialised (over the concrete
        rationals a competing algebra instance blocks the direct
        application).
        PdtTraceTensor (the seven general theorems and the compositum
        instance as their corollary) was built by a Fable-class agent in
        four distinct builds of fifteen budgeted, about one hour: the
        general trace identities by the same route as the compositum
        module with the specific bases replaced by variables; the
        signature product rule by orthogonal bases
        (LinearMap.BilinForm.exists_orthogonal_basis), the orthogonality
        of a tensor of orthogonal families, the basis representation of
        a form in an orthogonal basis, and a counting lemma for the
        signs of products of weights (Set.ncard of a disjoint union of
        two product sets); the isometry-of-tensors step anticipated in
        the brief was not needed. The compositum instance is then
        derived from the general theorems, with the parent's field
        instances on the factors switched off file-locally (they make a
        second, syntactically different algebra instance appear).
        This version (v2) followed a registry review of the sixteen-
        statement v1, which found the selection to be fixed low-degree
        computations and instances of classical results; the seven
        general theorems are the answer, and the instances are kept as
        the worked example.
