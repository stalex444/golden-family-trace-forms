project:
  name: "The trace forms of Q[x]/(x^3 - x - 1) and Q[x]/(x^4 - x - 1): Gram matrices, discriminants -23 and -283, and Sylvester signatures (2,1) and (3,1)"
  description: >-
    Kernel-checked arithmetic of the trace forms of the two fields cut
    out by the trinomials x^3 - x - 1 and x^4 - x - 1 — the cubic and
    quartic members of the family x^n - x - 1, irreducible over the
    rationals for every n >= 2 by Selmer's theorem (Mathlib), whose
    real roots above 1 are the plastic number and the quartic root of
    x^4 = x + 1. The trace form of a number field K of degree n is the
    symmetric bilinear form (x, y) -> Tr(xy); in the power basis
    1, x, ..., x^(n-1) its Gram matrix is the Hankel matrix (Tr x^(i+j))
    of the power sums of the roots. Ten compared statements, all about
    these two fields and nothing else. (1)-(2) The Gram matrices,
    entrywise: Algebra.traceMatrix of the power family equals the
    explicit integer Hankel matrix — power sums 3, 0, 2, 3, 2 for the
    cubic and 4, 0, 0, 3, 4, 0, 3 for the quartic, from Newton's
    identities on the coefficients. (3)-(4) The discriminants of the
    power bases, Algebra.discr of the same families: -23 and -283, both
    prime. (5)-(6) Explicit diagonalisations: the trace form, as a
    quadratic form, is equivalent to the weighted sum of squares with
    weights 3, 2, -23/6 resp. 4, 4, -9/4, 283/36 — one congruence
    among many, exhibited with its rational change of basis. (7)-(10)
    The Sylvester signatures as basis-free invariants: Mathlib's sigPos
    and sigNeg (the maximal dimension of a positive- resp.
    negative-definite subspace) are 2 and 1 for the cubic trace form
    and 3 and 1 for the quartic trace form, read off from (5)-(6)
    through the uniqueness half of Sylvester's law of inertia
    (QuadraticForm.sigPos_of_equiv_weightedSumSquares). THE CLASSICAL
    SETTING: the trace form of a number field with r_1 real and r_2
    pairs of complex embeddings has signature (r_1 + r_2, r_2) — for
    the Hankel form of a polynomial this is Hermite's 1856 theorem (the
    signature difference counts the distinct real roots), and for the
    discriminant matrix of a number field it is Taussky's 1968 note;
    Conner and Perlis's 1984 survey is the standard reference. WHY
    THESE TWO FIELDS: the cubic field is the signature-[1, 1] cubic
    field of smallest absolute discriminant (LMFDB, sorted by |disc|:
    3.1.23.1 first, then 3.1.31.1); its Galois closure is the Artin
    field of the weight-one newform 23.1.b.a = eta(z) eta(23z), the
    classical Hecke example with Artin image S_3, whose analytic
    conductor the LMFDB records as minimal among all classical newforms
    and whose Stark unit is the root of x^3 - x - 1 itself; and its
    integral trace form — which the compared Gram matrix (1) is, the
    power basis being an integral basis — is the object of
    Mantilla-Soler's study of integral trace forms of cubic fields
    (Algebra & Number Theory 2010; MSC 11E12, 11R29, 11R16 — the
    classes of this entry), which asks how much of a cubic field its
    integral trace form determines. The quartic field is the degree-4
    member of the same trinomial family, registered as the degree-4
    Mahler-measure minimizer (PALOMAR-2026-08-31-000004), with the same
    profile: prime discriminant, monogenic. Here
    (r_1, r_2) = (1, 1) and (2, 1), so the classical theorem predicts
    exactly (2, 1) and (3, 1), and the Hermite count 2 - 1 = 1 and
    3 - 1 = 2 matches the real-root counts of the two trinomials. The
    general theorem is NOT formalized: the two instances are proved
    directly by explicit congruence and the invariants are read off
    through Mathlib's Sylvester uniqueness; the embedding counts r_1,
    r_2 appear in no compared statement. The field discriminants: the
    LMFDB records 4.2.283.1 (defining polynomial x^4 - x - 1, signature
    [2, 1], discriminant -283, monogenic, index 1) and 3.1.23.1
    (reduced defining polynomial x^3 - x^2 + 1, the field generated by
    -1/rho, signature [1, 1], discriminant -23, monogenic, index 1)
    list -283 and -23 as the field discriminants; that the power
    bases are integral bases, so that the compared power-basis
    discriminants ARE the field discriminants, is cited from those
    records and not formalized. PRIOR ART, as of the 2026-09-02 sweep:
    Mathlib at the pin contains the trace-form and discriminant
    infrastructure (Algebra.traceForm, Algebra.traceMatrix,
    Algebra.discr with discr_def) and the signature invariants with
    Sylvester uniqueness (sigPos, sigNeg,
    sigPos_of_equiv_weightedSumSquares), but no statement of the
    (r_1 + r_2, r_2) theorem and no trace-form or discriminant
    computation for either of these fields. The nearest prior work is
    the Lean 4 certification framework of Baanen, Chavarri Villarello
    and Dahmen (CPP 2025) and its 2026 sequel (Chavarri Villarello and
    Dahmen): they certify rings of integers, FIELD discriminants (as
    the determinant of the trace matrix of a certified integral basis)
    and, in the sequel, the signature (r_1, r_2) by real-root
      counting, for LMFDB entries at large; neither treats the trace
    form's Sylvester signature, and their published example sets (seven
    non-monogenic cubic fields unramified outside 2, 3, 5 in the
    first; the v1 example directory of the second) contain neither of
    the two fields here (checked 2026-09-02). Relative to that work,
    the compared discriminants (3)-(4) are the power-basis
    discriminants derived from the explicit Gram matrices — a weaker
    notion than the certified field discriminant, which coincides
    with it here because both fields are monogenic (LMFDB, cited) —
    and the Sylvester signatures (7)-(10) have no counterpart there.
    The entry is not aware of a formalization of a number field's
    trace-form Sylvester signature in any surveyed prover ecosystem.
    The proof modules descend from the
    author's public pdt-lean development (pinned below), where none of
    these statements was ever a compared statement. Axioms on every
    compared theorem: propext, Classical.choice, Quot.sound, audited
    in-build.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

