      - "Alain Chavarri Villarello"
      - "Sander R. Dahmen"
    id: "Proceedings of the 14th ACM SIGPLAN International Conference on Certified Programs and Proofs (CPP 2025), ACM, 50-66"
    # Crossref-verified 2026-09-02 (this entry): DOI
    # 10.1145/3703595.3705874 — authors Baanen, Chavarri Villarello,
