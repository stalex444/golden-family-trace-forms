    type: "article"
    location: "https://doi.org/10.1145/3703595.3705874"
    relationship: "background"
    note: >-
      PRIOR ART, disclosed. A Lean 4 + Mathlib framework certifying
      rings of integers of number fields and their field discriminants
      (as the determinant of the trace matrix of a certified integral
      basis), validated on LMFDB entries — seven non-monogenic cubic
      fields unramified outside 2, 3 and 5, among others. It does not
      treat the trace form's Sylvester signature. Neither field of this
      entry is among its published examples (checked 2026-09-02). The
      compared discriminants here are the power-basis discriminants,
      derived from the explicit Gram matrices rather than certified
      through the ring of integers; they coincide with the field
      discriminants because both fields are monogenic (LMFDB, cited,
      not formalized).
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Formally certifying number field invariants"
    authors:
      - "Alain Chavarri Villarello"
      - "Sander R. Dahmen"
    id: "arXiv:2607.26230 (submitted 2026-07-28)"
